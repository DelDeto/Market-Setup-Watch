name: ATLAS V2 Preview End-to-End Test
on:
  pull_request:
    paths:
      - 'terminal/**'
      - '.github/workflows/atlas-v2-preview-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebSocket test dependency (not production)
        run: npm install --no-save ws@8
      - name: Test public WebSocket push from preview Durable Object
        env:
          ATLAS_URL: https://atlas-terminal-v2-preview.duc-nguyen-ndd127.workers.dev
        run: node terminal/smoke_ws.mjs
      - name: Check read APIs and refuse unauthenticated publishing
        env:
          ATLAS_URL: https://atlas-terminal-v2-preview.duc-nguyen-ndd127.workers.dev
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          b=os.environ['ATLAS_URL']
          def check(path):
              with urllib.request.urlopen(urllib.request.Request(b+path,headers={'User-Agent':'ATLAS-Preview-Validation/2.0'}),timeout=25) as r:return json.load(r)
          with urllib.request.urlopen(urllib.request.Request(b+'/',headers={'User-Agent':'ATLAS-Preview-Validation/2.0'}),timeout=20) as page_response:
              page=page_response.read().decode('utf-8')
          assert 'id="timezoneSelect"' in page and 'value="VN"' in page and 'value="UTC"' in page
          assert '<select id="pairAssetA"' in page and '<select id="pairAssetB"' in page
          assert 'id="pairFilterA"' in page and 'id="pairFilterB"' in page
          with urllib.request.urlopen(urllib.request.Request(b+'/assets/relationship.js',headers={'User-Agent':'ATLAS-Preview-Validation/2.0'}),timeout=20) as js_response:
              js=js_response.read().decode('utf-8')
          assert 'window.loadPairAssetCatalog=loadPairAssetCatalog' in js
          assert "get('/api/market')" in js
          assert "Asia/Ho_Chi_Minh" in page and "atlas.display_time_zone" in page
          h=check('/api/live-health');print('Feed:',h)
          assert h.get('updatedAt') and not h.get('error'),h
          t=check('/api/tracking');assert all(k in t for k in ('signals','events','publications'))
          o=check('/api/outcomes');assert 'bySource' in o and 'publications' in o
          w=check('/api/watchdog');assert 'watchdog' in w and 'method' in w
          assert w['watchdog']['status'] in ('OK','STALE','INITIALIZING')
          calendar=check('/api/macro/calendar')
          assert isinstance(calendar.get('events'),list),calendar
          assert 'health' in calendar
          macro=check('/api/macro?limit=10')
          assert macro.get('version')=='3.5'
          assert isinstance(macro.get('news'),list)
          assert isinstance(macro.get('feeds'),list)
          assert isinstance(macro.get('signalContext'),list)
          relation=check('/api/relationship?a=BTC&b=ZEC&tf=4h')
          assert relation.get('version')=='3.6',relation
          assert relation.get('assetA')=='BTC_USDT' and relation.get('assetB')=='ZEC_USDT',relation
          assert relation.get('matchedBars',0)>=22,relation
          assert relation.get('available') is True,relation
          dxy=check('/api/relationship?a=BTC&b=DXY&tf=4h')
          assert dxy.get('forcedDaily') and dxy.get('effectiveTimeframe') is None
          assert dxy.get('timeframe')=='1d' and dxy.get('available') is True,dxy
          assert dxy.get('sources',{}).get('b',{}).get('type')=='indicative_proxy',dxy
          assert dxy.get('samples',0)>=20,dxy
          print('ATLAS Pair Relationship ECB-DXY benchmark:',{'samples':dxy['samples'],'correlation':dxy['correlation'],'source':dxy['sources']['b']['name'],'timeframe':dxy['timeframe']})
          intel=check('/api/intelligence')
          assert intel.get('version')=='4.0.0-research',intel
          assert 'marketRegime' in intel and 'strategyLab' in intel and 'health' in intel,intel
          assert 'anomalies' in intel and 'rotation' in intel and 'capabilities' in intel,intel
          assert 'signalReadiness' in intel and 'funding' in intel,intel
          assert intel['marketRegime']['instruments']>50,intel['marketRegime']
          assert isinstance(intel['funding']['openInterestAvailable'],bool),intel['funding']
          assert 'id="intelligenceTab"' in page and 'id="intelRiskForm"' in page
          with urllib.request.urlopen(urllib.request.Request(b+'/assets/intelligence.js',headers={'User-Agent':'ATLAS-Preview-Validation/4.0'}),timeout=20) as js_response:
              intel_js=js_response.read().decode('utf-8')
          assert 'window.loadIntelligence=loadIntelligence' in intel_js
          risk=check('/api/intelligence/risk?equity=1000&entry=100&stop=98&riskPct=0.5&maxExposurePct=20&direction=LONG')
          assert risk['valid'] is True and risk['units']==2 and risk['exposureCapped'] is True,risk
          try:check('/api/intelligence/risk?equity=1000&entry=100&stop=110&riskPct=1&direction=LONG');raise AssertionError('Invalid stop accepted')
          except urllib.error.HTTPError as e:assert e.code==400,e.code
          print('ATLAS V4 Intelligence:',intel['marketRegime']['regime'],'anomalies',len(intel['anomalies']['items']),'health',intel['health']['status'])
          assert 'id="advancedTab"' in page and 'id="advBookSymbol"' in page and 'id="advReplay"' in page
          with urllib.request.urlopen(urllib.request.Request(b+'/assets/intelligence-advanced.js',headers={'User-Agent':'ATLAS-Preview-Validation/5.0'}),timeout=20) as script_response:
              advanced_js=script_response.read().decode('utf8')
          assert 'window.loadAdvanced=loadAdvanced' in advanced_js
          a=check('/api/intelligence/advanced')
          assert a.get('version')=='5.0-evidence',a
          assert isinstance(a.get('capabilities'),list) and len(a['capabilities'])==15,a
          assert 'smartMoney' in a and 'selfAudit' in a and 'tournament' in a,a
          assert 'oiSnapshot' in a and 'monitoredPlans' in a,a
          licensed=check('/api/intelligence/liquidations?symbol=BTC_USDT')
          assert licensed.get('available') is False and licensed.get('configured') is False,licensed
          assert 'id="advPremiumGo"' in page
          assistant=check('/api/intelligence/ask?q=btc%20trend')
          assert assistant.get('mode')=='RULE_BASED_EVIDENCE_ASSISTANT',assistant
          if a['monitoredPlans']:
              from urllib.parse import quote
              replay=check('/api/intelligence/replay?id='+quote(a['monitoredPlans'][0]['id'],safe=''))
              assert replay.get('monitor',{}).get('id')==a['monitoredPlans'][0]['id'],replay
          vol=check('/api/intelligence/volatility?symbol=BTC_USDT')
          assert vol.get('available') is True and vol.get('samples',0)>=34,vol
          try:
              book=check('/api/intelligence/liquidity?symbol=BTC_USDT')
              assert book.get('available') is True and book.get('liquidationHeatmapAvailable') is False,book
              print('ATLAS V5 MEXC order-book evidence:',book['spreadPct'])
          except urllib.error.HTTPError as e:
              if e.code!=503:raise
              print('ATLAS V5 upstream order book unavailable; route reports 503 honestly')
          print('ATLAS V5 advanced:',a['selfAudit']['status'],'OI coverage',a['oiSnapshot']['coverage'],
                'tournament observed',a['tournament']['reviewed'])
          m=check('/api/market');assert len(m.get('items',[]))>50
          req=urllib.request.Request(b+'/api/ingest/github',data=b'{}',headers={'Content-Type':'application/json','User-Agent':'ATLAS-Preview-Validation/2.0'})
          try:urllib.request.urlopen(req,timeout=20);raise AssertionError('Unauthorized publisher accepted!')
          except urllib.error.HTTPError as e:assert e.code==401,e.code
          for path in ('/api/watchdog/claim','/api/watchdog/ack','/api/macro/alerts/claim','/api/macro/alerts/ack'):
              req=urllib.request.Request(b+path,data=b'{}',headers={'Content-Type':'application/json','User-Agent':'ATLAS-Preview-Validation/2.0'})
              try:urllib.request.urlopen(req,timeout=20);raise AssertionError('Unauthenticated watchdog operation accepted!')
              except urllib.error.HTTPError as e:assert e.code in (401,403),(path,e.code)
          print('ATLAS V3.5 macro, watch, WebSocket & OIDC security checks OK')
          PY
