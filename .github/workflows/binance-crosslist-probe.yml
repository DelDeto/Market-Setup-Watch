name: Binance Crosslist Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/binance-crosslist-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Binance spot and futures
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          urls = {
              "spot": "https://api.binance.com/api/v3/exchangeInfo",
              "spot_vision": "https://data-api.binance.vision/api/v3/exchangeInfo",
              "futures": "https://fapi.binance.com/fapi/v1/exchangeInfo",
              "futures_data_api": "https://data-api.binance.vision/fapi/v1/exchangeInfo",
              "fapi1": "https://fapi1.binance.com/fapi/v1/exchangeInfo",
              "fapi2": "https://fapi2.binance.com/fapi/v1/exchangeInfo",
              "fapi3": "https://fapi3.binance.com/fapi/v1/exchangeInfo",
              "fapi4": "https://fapi4.binance.com/fapi/v1/exchangeInfo",
          }

          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data=json.loads(r.read().decode("utf-8"))
                  syms=data.get("symbols", [])
                  usdt=[x for x in syms if x.get("quoteAsset")=="USDT" and x.get("status")=="TRADING"]
                  print(name, "OK", "total", len(syms), "usdt_trading", len(usdt))
                  print(name, "sample", [x.get("symbol") for x in usdt[:10]])
              except Exception as e:
                  print(name, "ERROR", repr(e))
          PY
