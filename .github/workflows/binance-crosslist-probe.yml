name: Binance Crosslist Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/binance-crosslist-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Binance spot and futures intersection
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from market_hub.binance_crosslist import (
              get_binance_crosslisted_bases,
              mexc_underlying,
          )

          bases, meta = get_binance_crosslisted_bases()
          print("META", meta)
          if bases is None:
              raise SystemExit("Cross-list unavailable and cache missing")

          payload = requests.get(
              "https://api.mexc.com/api/v1/contract/detail",
              timeout=20,
          ).json()
          rows = payload.get("data", [])
          mexc = {
              row.get("symbol")
              for row in rows
              if (
                  row.get("symbol")
                  and str(row.get("quoteCoin") or row.get("settleCoin") or "").upper() == "USDT"
                  and row.get("state") not in (2, 3, 4, "2", "3", "4")
              )
          }
          kept = sorted(s for s in mexc if mexc_underlying(s) in bases)
          print("MEXC_COUNT", len(mexc))
          print("CROSSLISTED_MEXC_COUNT", len(kept))

          tests = [
              "BTC_USDT", "ETH_USDT", "PEPE_USDT", "SHIB_USDT",
              "APT_USDT", "XLM_USDT", "NIGHT_USDT", "VVV_USDT",
              "SOXL_USDT", "SOXS_USDT", "NAS100_USDT",
              "MSTRSTOCK_USDT", "CRCLSTOCK_USDT", "USOIL_USDT",
          ]
          for symbol in tests:
              print(
                  "CHECK",
                  symbol,
                  "MEXC=" + str(symbol in mexc),
                  "UNDERLYING=" + mexc_underlying(symbol),
                  "KEEP=" + str(symbol in kept),
              )
          PY
