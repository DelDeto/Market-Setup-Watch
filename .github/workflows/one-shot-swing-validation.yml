name: One Shot Swing Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-swing-validation.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Market Setup Watch with Swing V1
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/market-setup-watch.yml/dispatches" \
            -f ref=main
          echo "Swing validation dispatch accepted."
