name: ATLAS Terminal Health Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: read

concurrency:
  group: atlas-terminal-watchdog
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify terminal data freshness and notify on incident
        env:
          TERMINAL_URL: https://atlas-market-terminal.duc-nguyen-ndd127.workers.dev
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          from datetime import datetime,timezone
          base=os.environ['TERMINAL_URL']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'ATLAS-Terminal-Watchdog/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read())
          errors=[]
          try:
              h=get('/api/health')
              if h.get('status')!='ok':
                  errors.append('worker health: '+str(h.get('status')))
              if h.get('lastError'):
                  errors.append('sync error: '+str(h['lastError'])[:180])
          except Exception as exc:
              errors.append('health API error: '+str(exc)[:160])
          try:
              m=get('/api/market')
              if not m.get('items'):
                  errors.append('empty MEXC market response')
              if m.get('mode')!='live-on-request':
                  errors.append('MEXC upstream fallback active')
          except Exception as exc:
              errors.append('market API error: '+str(exc)[:160])
          try:
              live=get('/api/live-health')
              updated=live.get('updatedAt')
              if not updated:
                  errors.append('live hub has never published a price snapshot')
              else:
                  dt=datetime.fromisoformat(updated.replace('Z','+00:00'))
                  delay=(datetime.now(timezone.utc)-dt).total_seconds()
                  if delay>120:
                      errors.append('live hub has stale data (%.0fs)'%delay)
              if live.get('error'):
                  errors.append('live hub: '+str(live.get('error'))[:140])
          except Exception as exc:
              errors.append('live hub API error: '+str(exc)[:140])
          if not errors:
              print('ATLAS healthy: scheduled sync, WebSocket hub and live market feed responded')
              raise SystemExit(0)
          message='⚠️ ATLAS TERMINAL HEALTH ALERT\n'+'\n'.join(errors)+'\n'+base+'/api/health'
          token=os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat=os.environ.get('TELEGRAM_CHAT_ID','')
          if token and chat:
              payload=urllib.parse.urlencode({'chat_id':chat,'text':message}).encode()
              req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=payload,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print('Telegram incident notification HTTP',r.status)
              except Exception as exc:
                  print('Telegram notification failed:',type(exc).__name__)
          else:
              print('Telegram credentials absent; incident only in Actions logs')
          print('Incidents:',errors)
          raise SystemExit(1)
          PY
