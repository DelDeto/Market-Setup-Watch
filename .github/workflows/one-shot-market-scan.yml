name: One Shot Market Scan Dispatch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-market-scan.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel obsolete scanner run
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/37144090738/cancel" || true
          echo "Obsolete run cancellation requested; queued latest run remains intact."
