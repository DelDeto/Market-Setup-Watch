name: Market Setup Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-setup-watchdog.yml"
  schedule:
    # Recovery path offset from the primary scanner cadence. Also self-tests scanner architecture changes.
    # Cron was refreshed on 2026-10-02 to explicitly reactivate scheduling.
    - cron: "2,17,32,47 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: market-setup-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_WORKFLOW: market-setup-watch.yml
      STALE_MINUTES: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check scanner freshness and recover if needed
        shell: bash
        run: |
          set -uo pipefail

          notify_failure() {
            local message="$1"
            if [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
              curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=⚠️ MARKET SETUP WATCHDOG | ${message}" >/dev/null || true
            fi
          }

          dispatch_main() {
            echo "Dispatching recovery run for ${MAIN_WORKFLOW}..."
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${MAIN_WORKFLOW}/dispatches" -f ref=main; then
              echo "Recovery dispatch accepted."
              return 0
            fi

            notify_failure "Scanner stale/failed, but recovery dispatch failed."
            echo "Recovery dispatch failed." >&2
            return 1
          }

          if ! RUNS_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${MAIN_WORKFLOW}/runs?per_page=1")"; then
            notify_failure "Could not read the latest Market Setup Watch run."
            exit 1
          fi

          STATUS="$(jq -r '.workflow_runs[0].status // "missing"' <<<"${RUNS_JSON}")"
          CONCLUSION="$(jq -r '.workflow_runs[0].conclusion // "missing"' <<<"${RUNS_JSON}")"
          UPDATED_AT="$(jq -r '.workflow_runs[0].updated_at // .workflow_runs[0].created_at // empty' <<<"${RUNS_JSON}")"
          RUN_ID="$(jq -r '.workflow_runs[0].id // "missing"' <<<"${RUNS_JSON}")"

          echo "Latest main run: id=${RUN_ID} status=${STATUS} conclusion=${CONCLUSION} updated=${UPDATED_AT:-missing}"

          if [[ "${STATUS}" == "queued" || "${STATUS}" == "in_progress" || "${STATUS}" == "waiting" ]]; then
            echo "Main scanner is active; no recovery needed."
            exit 0
          fi

          if [[ "${STATUS}" == "missing" || -z "${UPDATED_AT}" ]]; then
            echo "No main workflow run found."
            dispatch_main
            exit $?
          fi

          AGE_SECONDS="$(python -c 'from datetime import datetime, timezone; import sys; dt=datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")); print(int((datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()))' "${UPDATED_AT}")"
          STALE_SECONDS="$((STALE_MINUTES * 60))"

          echo "Latest main run age: ${AGE_SECONDS}s; stale threshold: ${STALE_SECONDS}s."

          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "Latest main run did not succeed."
            dispatch_main
            exit $?
          fi

          if (( AGE_SECONDS >= STALE_SECONDS )); then
            echo "Latest successful scanner run is stale."
            dispatch_main
            exit $?
          fi

          echo "Main scanner is healthy; no recovery needed."
