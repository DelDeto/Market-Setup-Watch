name: Market Setup V3 Functional Smoke

on:
  push:
    branches:
      - signal-v3-entry-centric
    paths:
      - ".github/workflows/market-v3-functional-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scanner without Telegram secrets
        run: python -m market_hub.main
