name: Market Signal Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/market-signal-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit latest recommendations against live MEXC
        shell: bash
        run: |
          python - <<'PY'
          import json, math, statistics, urllib.request, urllib.parse
          from datetime import datetime, timezone

          BASE = "https://api.mexc.com"
          state = json.load(open("market_hub/state.json", encoding="utf-8"))
          signal_time = state.get("updated_at_utc")
          rows = []

          def get_json(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent":"MarketSetupAudit/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          def ema(values, period):
              if not values:
                  return None
              alpha = 2/(period+1)
              out = values[0]
              for v in values[1:]:
                  out = alpha*v + (1-alpha)*out
              return out

          def fetch_closes(symbol, interval, seconds, bars=80):
              now = int(datetime.now(timezone.utc).timestamp())
              start = now - seconds*(bars+8)
              p = get_json(f"/api/v1/contract/kline/{symbol}", {
                  "interval": interval, "start": start, "end": now
              })
              d = p.get("data", {})
              if not isinstance(d, dict):
                  return []
              times = d.get("time", [])
              closes = d.get("close", [])
              pairs=[]
              for t,c in zip(times,closes):
                  try:
                      t=float(t); c=float(c)
                  except:
                      continue
                  if t + seconds <= now:
                      pairs.append((t,c))
              pairs.sort()
              return pairs[-bars:]

          tick = get_json("/api/v1/contract/ticker")
          tickrows = tick.get("data", [])
          if isinstance(tickrows, dict):
              tickrows=[tickrows]
          ticker = {}
          for r in tickrows:
              s=r.get("symbol")
              if not s: continue
              try:
                  ticker[s]=float(r.get("lastPrice"))
              except:
                  pass

          for sig in state.get("signatures", []):
              parts=sig.split("|")
              if len(parts) < 7:
                  continue
              symbol,bucket,direction,mtf,lo,hi,execution = parts[:7]
              lo=float(lo); hi=float(hi)
              mid=(lo+hi)/2
              current=ticker.get(symbol)
              if current is None:
                  continue
              side=1 if direction.lower()=="long" else -1
              signed_move=(current-mid)/mid*100*side

              c15=fetch_closes(symbol,"Min15",900,24)
              c1h=fetch_closes(symbol,"Min60",3600,80)
              closes15=[x[1] for x in c15]
              closes1h=[x[1] for x in c1h]

              mom15=None
              if len(closes15)>=5 and closes15[-5] != 0:
                  mom15=(closes15[-1]/closes15[-5]-1)*100

              e20=ema(closes1h[-60:],20) if len(closes1h)>=20 else None
              e50=ema(closes1h[-80:],50) if len(closes1h)>=50 else None
              trend1h="UNKNOWN"
              if e20 is not None and e50 is not None:
                  if current > e20 > e50:
                      trend1h="BULL"
                  elif current < e20 < e50:
                      trend1h="BEAR"
                  else:
                      trend1h="MIXED"

              aligned1h = (
                  (direction.lower()=="long" and trend1h=="BULL") or
                  (direction.lower()=="short" and trend1h=="BEAR")
              )
              against1h = (
                  (direction.lower()=="long" and trend1h=="BEAR") or
                  (direction.lower()=="short" and trend1h=="BULL")
              )

              if signed_move >= 0.35 and aligned1h:
                  verdict="CONFIRMING"
              elif signed_move > 0 and not against1h:
                  verdict="FAVORABLE"
              elif signed_move <= -0.35 and against1h:
                  verdict="INVALIDATING"
              elif signed_move < 0:
                  verdict="AGAINST"
              else:
                  verdict="NEUTRAL"

              rows.append({
                  "symbol":symbol,
                  "bucket":bucket,
                  "direction":direction.upper(),
                  "entry_mid":mid,
                  "current":current,
                  "signed_move_pct":round(signed_move,4),
                  "mom15_1h_pct": None if mom15 is None else round(mom15,4),
                  "trend1h":trend1h,
                  "mtf_at_signal":mtf,
                  "verdict":verdict
              })

          rows.sort(key=lambda x: (0 if x["bucket"]=="ENTRY_READY" else 1, -x["signed_move_pct"]))
          print("SIGNAL_TIME_UTC", signal_time)
          print("AUDIT_TIME_UTC", datetime.now(timezone.utc).isoformat())
          print("AUDIT_JSON_BEGIN")
          print(json.dumps(rows, ensure_ascii=False))
          print("AUDIT_JSON_END")

          if rows:
              favorable=sum(r["verdict"] in ("CONFIRMING","FAVORABLE") for r in rows)
              against=sum(r["verdict"] in ("AGAINST","INVALIDATING") for r in rows)
              neutral=len(rows)-favorable-against
              print(f"SUMMARY favorable={favorable} against={against} neutral={neutral} total={len(rows)}")
          PY
