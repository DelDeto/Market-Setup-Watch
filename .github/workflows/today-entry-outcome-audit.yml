name: Today Entry Outcome Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/today-entry-outcome-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit active 03-10 VN entries against current MEXC
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          VN=timezone(timedelta(hours=7))
          rows=json.load(open("market_hub/outcomes.json",encoding="utf-8"))
          day_start=datetime(2026,10,3,0,0,tzinfo=VN).astimezone(timezone.utc)
          day_end=datetime(2026,10,4,0,0,tzinfo=VN).astimezone(timezone.utc)

          def get_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"MarketOutcomeAudit/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode())

          ticker_payload=get_json("https://api.mexc.com/api/v1/contract/ticker")
          ticker_rows=ticker_payload.get("data",[])
          if isinstance(ticker_rows,dict): ticker_rows=[ticker_rows]
          last_price={}
          for x in ticker_rows:
              try: last_price[x.get("symbol")]=float(x.get("lastPrice"))
              except: pass

          active=[]
          for r in rows:
              if r.get("status")!="ACTIVE" or not r.get("entry_time_utc"):
                  continue
              et=datetime.fromisoformat(r["entry_time_utc"].replace("Z","+00:00"))
              if day_start <= et < day_end:
                  active.append(r)

          seen=set()
          for r in active:
              key=(r["symbol"],r["direction"],r["entry_time_utc"])
              if key in seen: continue
              seen.add(key)

              symbol=r["symbol"]; direction=r["direction"]
              entry_mid=(float(r["entry_lower"])+float(r["entry_upper"]))/2
              sl=float(r["stop_loss"]); tp=float(r["tp1"])
              start=int(datetime.fromisoformat(r["entry_time_utc"].replace("Z","+00:00")).timestamp())
              end=int(datetime.now(timezone.utc).timestamp())
              q=urllib.parse.urlencode({"interval":"Min15","start":start,"end":end})
              data=get_json(f"https://api.mexc.com/api/v1/contract/kline/{symbol}?{q}").get("data",{})

              times=data.get("time",[]) if isinstance(data,dict) else []
              highs=data.get("high",[]) if isinstance(data,dict) else []
              lows=data.get("low",[]) if isinstance(data,dict) else []
              closes=data.get("close",[]) if isinstance(data,dict) else []

              outcome="ACTIVE"
              hit_at=None
              for t,h,l in zip(times,highs,lows):
                  h=float(h); l=float(l)
                  if direction=="long":
                      tp_hit=h>=tp; sl_hit=l<=sl
                  else:
                      tp_hit=l<=tp; sl_hit=h>=sl
                  if tp_hit and sl_hit:
                      outcome="AMBIGUOUS"; hit_at=t; break
                  if tp_hit:
                      outcome="WIN"; hit_at=t; break
                  if sl_hit:
                      outcome="LOSS"; hit_at=t; break

              current=last_price.get(symbol)
              risk=abs(entry_mid-sl)
              current_r=None
              if current is not None and risk>0:
                  current_r=((current-entry_mid)/risk) if direction=="long" else ((entry_mid-current)/risk)

              print("AUDIT",json.dumps({
                  "symbol":symbol,"direction":direction,"entry_time_utc":r["entry_time_utc"],
                  "outcome_now":outcome,"hit_time":hit_at,"current":current,
                  "current_r":None if current_r is None else round(current_r,3),
                  "tp1":tp,"sl":sl,"stored_mfe_r":r.get("mfe_r"),"stored_mae_r":r.get("mae_r")
              },ensure_ascii=False))
          PY
