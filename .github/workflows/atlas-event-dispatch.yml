name: ATLAS Observed-Price Telegram Relay
on:
  push:
    branches: [main]
    paths:
      - 'terminal/watchdog.js'
      - 'terminal/dispatch_events.py'
      - '.github/workflows/atlas-event-dispatch.yml'
  workflow_dispatch:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-telegram-dispatch
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send observed price-level updates through existing Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATLAS_URL: https://atlas-market-terminal.duc-nguyen-ndd127.workers.dev
        run: python terminal/dispatch_events.py
