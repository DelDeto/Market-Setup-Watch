name: Market Setup Watch

on:
  workflow_dispatch:
  schedule:
    # Four scans per hour, shortly after 15M candle closes.
    - cron: "8,23,38,53 * * * *"

permissions:
  contents: write

concurrency:
  group: market-setup-watch
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile scanner
        run: |
          python -m py_compile             smc_analysis.py             trade_plan.py             market_hub/config.py             market_hub/mexc_market.py             market_hub/participation.py             market_hub/market_context.py             market_hub/correlation.py             market_hub/calibration.py             market_hub/outcomes.py             market_hub/ranker.py             market_hub/scanner.py             market_hub/chart.py             market_hub/notifier.py             market_hub/main.py

      - name: Scan MEXC USDT perpetual market
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m market_hub.main

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: Market-Setup-Watch
          path: |
            output/market_hub_report.json
            output/market_hub_update.txt
            output/charts/*.png
            market_hub/calibration.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist scanner state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_hub/state.json market_hub/outcomes.json market_hub/calibration.json

          if git diff --cached --quiet; then
            echo "No scanner state changes to commit."
            exit 0
          fi

          git commit -m "Update Market Setup Watch state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
