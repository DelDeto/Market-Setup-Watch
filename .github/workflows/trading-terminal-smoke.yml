name: Trading Terminal Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'terminal/**'
      - '.github/workflows/trading-terminal-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare WebSocket test dependency
        run: npm install --no-save ws@8
      - name: Verify realtime server-push WebSocket
        env:
          ATLAS_URL: https://atlas-market-terminal.duc-nguyen-ndd127.workers.dev
        run: node terminal/smoke_ws.mjs
      - name: Check deployed Worker public API
        env:
          BASE: https://atlas-market-terminal.duc-nguyen-ndd127.workers.dev
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          b=os.environ['BASE']
          def get(path):
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(b+path,headers={'User-Agent':'ATLAS-Terminal-Synthetic-Healthcheck/1.0','Accept':'text/html,application/json'})
                      with urllib.request.urlopen(request, timeout=15) as r:
                          raw=r.read()
                          assert r.status==200, (path, r.status)
                          return json.loads(raw) if path.startswith('/api') else raw.decode()
                  except urllib.error.HTTPError as e:
                      print('HTTP ERROR',path,e.code,dict(e.headers),e.read(800).decode('utf-8','replace'))
                      if attempt==2: raise
                  except Exception as e:
                      print('NETWORK ERROR',path,type(e).__name__,str(e))
                      if attempt==2: raise
                      time.sleep(5)
          html=get('/')
          assert 'ATLAS' in html and 'MARKET INTELLIGENCE' in html
          assert 'id="timezoneSelect"' in html and 'value="VN"' in html and 'value="UTC"' in html
          assert '<select id="pairAssetA"' in html and '<select id="pairAssetB"' in html
          assert 'id="pairFilterA"' in html and 'id="pairFilterB"' in html
          assert 'Asia/Ho_Chi_Minh' in html and 'atlas.display_time_zone' in html
          health=get('/api/health')
          assert health['status'] in ('not-initialized','stale','ok'),health
          dash=get('/api/dashboard')
          assert 'signals' in dash and 'health' in dash
          market=get('/api/market')
          assert market.get('items') and len(market['items'])>0, 'MEXC Futures market feed unavailable'
          live=get('/api/live-health')
          assert live.get('instrumentCount',0)>50 and not live.get('error'), live
          tracking=get('/api/tracking')
          assert all(k in tracking for k in ('signals','events','publications')),tracking.keys()
          wd=get('/api/watchdog')
          assert wd.get('watchdog',{}).get('status') in ('OK','STALE','INITIALIZING'),wd
          assert 'method' in wd,wd
          calendar=get('/api/macro/calendar')
          assert isinstance(calendar.get('events'),list),calendar
          macro=get('/api/macro?limit=10')
          assert macro.get('version')=='3.5' and isinstance(macro.get('news'),list),macro
          assert isinstance(macro.get('feeds'),list),macro
          relation=get('/api/relationship?a=BTC&b=ZEC&tf=4h')
          assert relation.get('version')=='3.6' and relation.get('available') is True,relation
          assert relation.get('samples',0)>=20,relation
          js=get('/assets/relationship.js')
          assert 'function analyzeRelationship' in js
          assert 'window.loadPairAssetCatalog=loadPairAssetCatalog' in js
          assert "get('/api/market')" in js
          assert 'id="intelligenceTab"' in html and 'id="intelRiskForm"' in html
          intel=get('/api/intelligence')
          assert intel.get('version')=='4.0.0-research',intel
          assert intel.get('health') and intel.get('marketRegime') and intel.get('capabilities'),intel
          assert intel['marketRegime']['instruments']>50,intel['marketRegime']
          assert isinstance(intel['funding']['openInterestAvailable'],bool),intel['funding']
          risk=get('/api/intelligence/risk?equity=1000&entry=100&stop=98&riskPct=0.5&maxExposurePct=20&direction=LONG')
          assert risk['valid'] and risk['units']==2 and risk['exposureCapped'],risk
          intel_js=get('/assets/intelligence.js')
          assert 'window.loadIntelligence=loadIntelligence' in intel_js
          print('ATLAS V4 Intelligence OK:',intel['health']['status'],intel['marketRegime']['regime'])
          assert 'id="advancedTab"' in html and 'id="advBookSymbol"' in html
          adv=get('/api/intelligence/advanced')
          assert adv.get('version')=='5.0-evidence' and len(adv.get('capabilities',[]))==15,adv
          assert isinstance(adv.get('smartMoney',{}).get('items'),list),adv
          assert adv.get('selfAudit') and adv.get('tournament') and 'oiSnapshot' in adv,adv
          assert 'monitoredPlans' in adv,adv
          cli=get('/assets/intelligence-advanced.js')
          assert 'window.loadAdvanced=loadAdvanced' in cli,cli[:200]
          assistant=get('/api/intelligence/ask?q=btc%20trend')
          assert assistant.get('mode')=='RULE_BASED_EVIDENCE_ASSISTANT',assistant
          premium=get('/api/intelligence/liquidations?symbol=BTC_USDT')
          assert premium.get('available') is False and premium.get('configured') is False,premium
          if adv['monitoredPlans']:
              from urllib.parse import quote
              replay=get('/api/intelligence/replay?id='+quote(adv['monitoredPlans'][0]['id'],safe=''))
              assert replay.get('monitor',{}).get('id')==adv['monitoredPlans'][0]['id'],replay
          vol=get('/api/intelligence/volatility?symbol=BTC_USDT')
          assert vol.get('available') is True and vol.get('samples',0)>=34,vol
          book=get('/api/intelligence/liquidity?symbol=BTC_USDT')
          assert book.get('available') is True and book.get('liquidationHeatmapAvailable') is False,book
          print('ATLAS V5 Add-ons OK:',adv['selfAudit']['status'],'OI snapshot symbols',adv['oiSnapshot']['coverage'],
                'chronological observations',adv['tournament']['reviewed'])
          outcome=get('/api/outcomes')
          assert 'publications' in outcome and 'bySource' in outcome
          research=get('/api/research')
          assert 'signals' in research and 'sources' in research
          print('Public Worker OK:',health)
          PY
