name: Trading Terminal Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'terminal/**'
      - '.github/workflows/trading-terminal-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare WebSocket test dependency
        run: npm install --no-save ws@8
      - name: Verify realtime server-push WebSocket
        env:
          ATLAS_URL: https://atlas-market-terminal.duc-nguyen-ndd127.workers.dev
        run: node terminal/smoke_ws.mjs
      - name: Check deployed Worker public API
        env:
          BASE: https://atlas-market-terminal.duc-nguyen-ndd127.workers.dev
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          b=os.environ['BASE']
          def get(path):
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(b+path,headers={'User-Agent':'ATLAS-Terminal-Synthetic-Healthcheck/1.0','Accept':'text/html,application/json'})
                      with urllib.request.urlopen(request, timeout=15) as r:
                          raw=r.read()
                          assert r.status==200, (path, r.status)
                          return json.loads(raw) if path.startswith('/api') else raw.decode()
                  except urllib.error.HTTPError as e:
                      print('HTTP ERROR',path,e.code,dict(e.headers),e.read(800).decode('utf-8','replace'))
                      if attempt==2: raise
                  except Exception as e:
                      print('NETWORK ERROR',path,type(e).__name__,str(e))
                      if attempt==2: raise
                      time.sleep(5)
          html=get('/')
          assert 'ATLAS' in html and 'MARKET INTELLIGENCE' in html
          assert 'id="timezoneSelect"' in html and 'value="VN"' in html and 'value="UTC"' in html
          assert 'Asia/Ho_Chi_Minh' in html and 'atlas.display_time_zone' in html
          health=get('/api/health')
          assert health['status'] in ('not-initialized','stale','ok'),health
          dash=get('/api/dashboard')
          assert 'signals' in dash and 'health' in dash
          market=get('/api/market')
          assert market.get('items') and len(market['items'])>0, 'MEXC Futures market feed unavailable'
          live=get('/api/live-health')
          assert live.get('instrumentCount',0)>50 and not live.get('error'), live
          tracking=get('/api/tracking')
          assert all(k in tracking for k in ('signals','events','publications')),tracking.keys()
          wd=get('/api/watchdog')
          assert wd.get('watchdog',{}).get('status') in ('OK','STALE','INITIALIZING'),wd
          assert 'method' in wd,wd
          calendar=get('/api/macro/calendar')
          assert isinstance(calendar.get('events'),list),calendar
          macro=get('/api/macro?limit=10')
          assert macro.get('version')=='3.5' and isinstance(macro.get('news'),list),macro
          assert isinstance(macro.get('feeds'),list),macro
          outcome=get('/api/outcomes')
          assert 'publications' in outcome and 'bySource' in outcome
          research=get('/api/research')
          assert 'signals' in research and 'sources' in research
          print('Public Worker OK:',health)
          PY
